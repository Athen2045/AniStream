name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (runtime blocking, full advisory report)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies without native rebuild
        # --legacy-peer-deps: see ci.yml -- eslint-plugin-react/eslint peer-range lag, harmless.
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Fail on runtime dependency vulnerabilities
        run: npm audit --omit=dev

      - name: Report full advisory tree (dev + runtime, non-blocking)
        if: always()
        run: npm audit || true
