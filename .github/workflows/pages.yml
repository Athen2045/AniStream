name: Website

# Publishes the landing page (website/) to GitHub Pages. Download links point at the latest
# release, so the page is rebuilt after every production release as well as on page changes.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/screenshots/**"
      - "assets/app-icon/**"
      - "scripts/build-website.mjs"
      - ".github/workflows/pages.yml"
  # Releases are published with GITHUB_TOKEN, which does not fire `release` events.
  workflow_run:
    workflows: ["Promote production release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-website.mjs

      - name: Check release links
        run: |
          grep -q 'releases/download/v' dist-website/index.html \
            || { echo "::error::No installer links in the built page"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-website

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
