name: Promote production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from package.json, for example 2.0.0"
        required: true
        type: string
      dry_run:
        description: "Release candidate: build and verify both installers from the selected branch without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The version is free text typed into the dispatch form: accept only plain X.Y.Z, and read it
      # through the environment (never pasted into a script). A real release must be started from
      # main, so the workflow file that runs is main's own.
      - name: Check the version and the starting branch
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 2.2.0."; exit 1; }
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::A real release must be started from main (this run: $GITHUB_REF)."
            exit 1
          fi

      # A real release always builds protected main. A dry run builds the branch the workflow was
      # started from (for example develop) so both installers can be tested before merging.
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify native and renderer branding assets
        run: npm run check:branding

      - name: Install dependencies
        run: npm ci

      - name: Check version and release notes
        env:
          VERSION: ${{ inputs.version }}
        run: npm run check:release-version -- "$VERSION"

      - name: Run release checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
          npm run check:product-slice
          npm run check:anilist-oauth
          npm audit --omit=dev

      - name: Record exact main commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows release artifact
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write local provider configuration
        # Streaming-source endpoints are not in the repository; they come from a secret.
        uses: ./.github/actions/write-provider-config
        with:
          providers-json: ${{ secrets.ANISTREAM_PROVIDERS_JSON }}
          required: "true"

      - name: Build unsigned Windows installer
        run: npm run package:win
        env:
          # Read-only public-data keys bundled into the package (scripts/write-app-keys.mjs).
          ANISTREAM_TMDB_ACCESS_TOKEN: ${{ secrets.ANISTREAM_TMDB_ACCESS_TOKEN }}
          ANISTREAM_MAL_CLIENT_ID: ${{ secrets.ANISTREAM_MAL_CLIENT_ID }}
          ANISTREAM_APP_KEYS_REQUIRED: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          npm run check:anilist-oauth
          npm run check:packaged-build -- dist/win-unpacked/resources/app.asar
          npm run check:packaged-preload -- dist/win-unpacked/resources/app.asar
          $version = node -p "require('./package.json').version"
          npm run check:win-installer -- "dist/AniStream.Setup.$version.exe"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AniStream-release-win-x64-${{ inputs.version }}
          path: |
            dist/AniStream.Setup.*.exe
            dist/AniStream.Setup.*.exe.blockmap
            dist/latest.yml
          retention-days: 30
          if-no-files-found: error

  macos:
    name: Build macOS release artifact
    needs: validate
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Check out validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write local provider configuration
        # Streaming-source endpoints are not in the repository; they come from a secret.
        uses: ./.github/actions/write-provider-config
        with:
          providers-json: ${{ secrets.ANISTREAM_PROVIDERS_JSON }}
          required: "true"

      - name: Build unsigned Apple Silicon DMG
        run: npm run package:mac
        env:
          # Read-only public-data keys bundled into the package (scripts/write-app-keys.mjs).
          ANISTREAM_TMDB_ACCESS_TOKEN: ${{ secrets.ANISTREAM_TMDB_ACCESS_TOKEN }}
          ANISTREAM_MAL_CLIENT_ID: ${{ secrets.ANISTREAM_MAL_CLIENT_ID }}
          ANISTREAM_APP_KEYS_REQUIRED: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS artifact
        run: npm run check:mac-package

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AniStream-release-mac-arm64-${{ inputs.version }}
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: error

  candidate:
    name: Summarize release candidate
    if: ${{ inputs.dry_run }}
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: |
          {
            echo "## AniStream $VERSION release candidate"
            echo
            echo "Built from \`$REF_NAME\` at \`$COMMIT_SHA\`. Nothing was published or tagged."
            echo
            echo "Download the installers from this run's **Artifacts** section:"
            echo
            echo "- \`AniStream-release-win-x64-$VERSION\`"
            echo "- \`AniStream-release-mac-arm64-$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish approved GitHub release
    if: ${{ !inputs.dry_run }}
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      # Build provenance: the builds are unsigned, so anyone can check an installer came from this
      # workflow with `gh attestation verify <file> --repo Athen2045/AniStream`.
      id-token: write
      attestations: write
    steps:
      # This job is the only place allowed to create the tag or mutate a release.
      - name: Check out validated release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AniStream-release-win-x64-${{ inputs.version }}
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AniStream-release-mac-arm64-${{ inputs.version }}
          path: dist

      - name: Verify Windows update manifest
        # In-app updates follow latest.yml; it must name this tag's exact installer.
        working-directory: dist
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f latest.yml || { echo "::error::latest.yml is missing."; exit 1; }
          grep -qx "version: $VERSION" latest.yml || { echo "::error::latest.yml does not describe version $VERSION."; exit 1; }
          grep -qx "path: AniStream.Setup.$VERSION.exe" latest.yml || { echo "::error::latest.yml does not point at AniStream.Setup.$VERSION.exe."; exit 1; }
          test -f "AniStream.Setup.$VERSION.exe" || { echo "::error::The installer named in latest.yml is missing."; exit 1; }

      - name: Write SHA-256 checksums
        # The installers are unsigned, so publish checksums that downloads can be verified against.
        working-directory: dist
        shell: bash
        run: |
          sha256sum AniStream.Setup.*.exe AniStream-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest the installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/AniStream.Setup.*.exe
            dist/*.dmg

      - name: Create tag and GitHub Release
        # GitHub's own CLI (preinstalled): no third-party code runs with this job's write token.
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ needs.validate.outputs.commit_sha }}
        run: |
          shopt -s nullglob
          files=()
          for pattern in "AniStream.Setup.*.exe" "AniStream.Setup.*.exe.blockmap" latest.yml "*.dmg" SHA256SUMS.txt; do
            matches=($pattern)
            [ ${#matches[@]} -gt 0 ] && [ -e "${matches[0]}" ] || { echo "::error::No file matches $pattern."; exit 1; }
            files+=("${matches[@]}")
          done
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "v$VERSION" \
            --notes-file "../.github/releases/v$VERSION.md" \
            --latest

      - name: Write run summary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Published AniStream v$VERSION"
            echo
            echo "https://github.com/$REPOSITORY/releases/tag/v$VERSION"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
