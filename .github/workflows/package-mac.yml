name: Package macOS build

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/package-mac.yml"
      - "assets/app-icon/**"
      - "electron-builder.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-branding-assets.mjs"
      - "scripts/verify-mac-package.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify unsigned arm64 DMG
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify native and renderer branding assets
        run: npm run check:branding

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        # --legacy-peer-deps: see ci.yml -- eslint-plugin-react/eslint peer-range lag, harmless.
        run: npm ci --legacy-peer-deps

      - name: Build unsigned Apple Silicon package
        # electron-builder is build-only here. Publishing is intentionally owned by
        # the dedicated GitHub Release step below, which receives github.token.
        run: npm run package:mac
        env:
          # No Developer ID Application certificate is installed for this personal
          # build; disable electron-builder's local keychain identity search so the
          # packaging step stays deterministic and explicitly unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Mac bundle and mounted DMG against the fresh build
        run: npm run check:mac-package

      - name: Upload unsigned DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-mac-arm64-dmg
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error
