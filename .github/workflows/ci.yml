name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and contract checks
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify native and renderer branding assets
        run: npm run check:branding

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        # --legacy-peer-deps: eslint-plugin-react@7.37.5 (latest available) declares a
        # peer range that predates eslint 10, and @babel/eslint-parser vs. eslint-plugin-react
        # disagree on the exact eslint peer range. Both are real-but-harmless peer-metadata
        # lag, not a runtime incompatibility -- see CONTEXT.md's ESLint/TypeScript-7 entry.
        run: npm ci --legacy-peer-deps

      - name: Type-check main, preload, shared, and renderer
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build production bundles
        run: npm run build

      - name: Verify product-slice contracts (session ordering, browse/detail IPC, provider types)
        run: npm run check:product-slice

      - name: Verify AniList implicit OAuth flow
        run: npm run check:anilist-oauth

  verify-windows:
    name: Verify Windows source and packaging prerequisites
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Windows-compatible source
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
          npm run check:product-slice
          npm run check:anilist-oauth

      # The built app against fixture data only (test/ui/fixtures): no real provider is contacted.
      - name: Run UI tests (Playwright on the built app)
        run: npx playwright test

      - name: Keep UI test output for a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7
