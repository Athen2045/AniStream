name: Package Windows build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify unsigned x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run check:product-slice
          npm run check:anilist-oauth

      - name: Build unsigned Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged preload
        shell: pwsh
        run: npm run check:packaged-preload -- dist/win-unpacked/resources/app.asar

      - name: Verify installer lifecycle
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          npm run check:win-installer -- "dist/AniStream Setup $version.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-win-x64-nsis-unsigned
          path: |
            dist/AniStream Setup *.exe
            dist/AniStream Setup *.exe.blockmap
          retention-days: 14
          if-no-files-found: error

  release:
    name: Attach Windows installer to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStream-win-x64-nsis-unsigned
          path: dist

      - name: Attach Windows installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          files: |
            dist/AniStream Setup *.exe
            dist/AniStream Setup *.exe.blockmap
          fail_on_unmatched_files: true
