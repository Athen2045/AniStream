name: Feature request
description: Suggest an idea or improvement for AniStream.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AniStream is a local-first desktop app with no ads, no telemetry, and no data selling.
        Ideas that keep your data on your device and in your control fit best.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Anime
        - Manga
        - More (movies and shows)
        - Discovery and recommendations
        - Profile, lists, and tracker sync
        - Player or reader
        - Settings, backup, or updates
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I finish an episode I have to go back to the title page to…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Workarounds you use today, or apps that do this well (screenshots welcome).
