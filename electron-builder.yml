appId: dev.anistream.desktop
productName: AniStream
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
# Local streaming-source endpoints and read-only public-data keys (both gitignored). Each is
# included only when it exists; release workflows write them from repository secrets.
extraResources:
  - from: .
    to: .
    filter:
      - providers.local.json
      - app-keys.local.json
protocols:
  - name: AniStream OAuth callback
    schemes:
      - anistream
mac:
  category: public.app-category.entertainment
  icon: assets/app-icon/AniStream.icns
  target:
    - target: dmg
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/app-icon/AniStream.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
